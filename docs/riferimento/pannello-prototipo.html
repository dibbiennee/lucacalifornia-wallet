<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pannello · Luca California</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 700'%3E%3Crect width='700' height='700' fill='%23000'/%3E%3Cg fill='%23F5F2EC' transform='translate(90 90) scale(.743)'%3E%3Cpolygon points='0,0 700,0 700,173'/%3E%3Cpolygon points='0,0 700,325 700,525'/%3E%3Cpolygon points='0,0 351,700 0,700'/%3E%3Cpolygon points='351,700 700,525 700,700'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap">
<style>
/* ===================== TOKEN (condivisi col sito) ===================== */
:root{
  --bg:#000000; --surface:#141318; --surface-2:#1E1C24; --line:#2E2B36; --nav:#050408;
  --text:#F5F2EC; --muted:#B3AEBD; --dim:#8E899A; --ink:#000000;
  --magenta:#FF3EA5;
  --milk:#FFB3DA; --acid:#E6FF4D; --cyan:#4DE1FF; --red:#FF4A3D; --sun:#FFB35C;
  --ok:#2FD37A; --wa:#25D366; --errore:#FFC2D1; --link:#7CC7FF;
  --esito-ok:#0B7A2F; --esito-no:#8E0B2B; --esito-gia:#8A5A00;
  --r-l:26px; --r-m:16px; --r-s:12px; --r-pill:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px; --s-8:64px;
  --t-veloce:150ms; --t-medio:250ms; --curva:cubic-bezier(.2,.8,.2,1);
  --font:'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --nav-h:calc(56px + env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000000; } }
:root[data-theme="dark"], :root[data-theme="light"]{ --bg:#000000; }
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg); -webkit-text-size-adjust:100%; scroll-padding-bottom:calc(var(--nav-h) + 16px)}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
button,input{font:inherit; color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--magenta); outline-offset:3px; border-radius:6px}
[hidden]{display:none !important}
[tabindex="-1"]:focus{outline:none}
.ph{white-space:nowrap}
.sr{position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ===================== LAYOUT ===================== */
.pagina{max-width:560px; margin:0 auto; overflow-x:clip; padding:calc(var(--s-5) + env(safe-area-inset-top,0px)) 20px calc(var(--nav-h) + var(--s-6)); display:flex; flex-direction:column; gap:var(--s-4)}
.pagina.senza-barra{padding-bottom:calc(var(--s-6) + env(safe-area-inset-bottom,0px))}
.sezione{display:flex; flex-direction:column; gap:var(--s-3); margin-top:var(--s-2)}

/* ===================== COMPONENTI ===================== */
/* Testata */
.testata{display:flex; flex-direction:column; gap:var(--s-2)}
.testata-riga{display:flex; justify-content:space-between; align-items:center; gap:var(--s-3); min-height:32px}
.occhiello{margin:0; font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.titolo{margin:0; font-size:clamp(30px, 9vw, 42px); font-weight:900; font-stretch:125%; line-height:.92; letter-spacing:-.01em; text-transform:uppercase; text-wrap:balance}
.sottotitolo{margin:0; color:var(--muted); font-size:15px}
.titolo-sezione{margin:0; font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.azione-testo{min-width:44px; appearance:none; border:0; background:none; color:var(--muted); font-size:14px; font-weight:700; text-decoration:underline; text-underline-offset:3px; min-height:44px; padding:0 var(--s-1); cursor:pointer}
.indietro{appearance:none; border:0; background:none; color:var(--muted); display:inline-flex; align-items:center; gap:6px; font-size:15px; font-weight:700; min-height:44px; padding:0; cursor:pointer; align-self:flex-start; text-decoration:none}
.indietro svg{width:18px; height:18px}

/* Etichetta di stato */
.etichetta{display:inline-flex; align-items:center; align-self:flex-start; padding:4px 10px; border-radius:var(--r-pill); font-size:12px; font-weight:800; line-height:1.3; color:var(--ink); white-space:nowrap}
.e-nuova{background:var(--acid)} .e-confermata{background:var(--ok)} .e-attesa{background:var(--sun)} .e-rifiutata{background:var(--esito-no); color:#fff} .e-corso{background:var(--magenta)}

/* Numero */
.numeri{display:grid; grid-template-columns:repeat(auto-fit, minmax(84px, 1fr)); gap:var(--s-2)}
.numeri.due{grid-template-columns:repeat(2,minmax(0,1fr))}
.numero{background:var(--surface-2); border-radius:var(--r-m); padding:var(--s-3); display:flex; flex-direction:column; gap:2px; min-width:0}
.numero b{font-size:30px; font-weight:900; font-stretch:112%; line-height:1}
.numero span{font-size:13px; color:var(--muted)}
.numero b.sale{animation:sale .5s ease}
@keyframes sale{0%{transform:scale(1.3); color:var(--ok)}}

/* Card */
.lista{display:flex; flex-direction:column; gap:var(--s-2)}
.card{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px var(--s-3); padding:var(--s-4); border-radius:var(--r-m); background:var(--surface); text-decoration:none; color:var(--text); transition:transform var(--t-veloce) var(--curva)}
a.card:active{transform:scale(.98)}
.card > b{font-size:17px; font-weight:700; min-width:0}
.card > .ora, .card > .etichetta{grid-column:2; grid-row:1; align-self:start}
.card > .ora{font-size:13px; font-weight:700; color:var(--muted)}
.card > span:not(.etichetta):not(.ora){grid-column:1 / -1; font-size:15px; color:#DCD7E4}
.card .riga-2{font-size:13px !important; color:var(--dim) !important}
.card .messaggio{font-style:italic}

/* Pulsanti */
.btn{appearance:none; border:0; cursor:pointer; min-height:52px; padding:0 var(--s-5); border-radius:var(--r-pill); font-size:15px; font-weight:800; letter-spacing:.01em; display:flex; align-items:center; justify-content:center; gap:var(--s-2); text-decoration:none; white-space:nowrap; width:100%; transition:transform var(--t-veloce) var(--curva), background-color var(--t-veloce)}
.btn:active{transform:scale(.97)}
.btn-pieno{background:var(--magenta); color:var(--ink)}
.btn-vuoto{background:transparent; color:var(--text); box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-whatsapp{background:var(--wa); color:#04250F}
.btn-pillola{background:var(--text); color:var(--ink); width:auto; min-height:56px; padding:0 var(--s-6)}
.btn:disabled{opacity:.65; cursor:progress; transform:none}
.due-pulsanti{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--s-2)}
@media (hover:hover){ .btn-pieno:hover{background:#FF62B6} .btn-vuoto:hover{box-shadow:inset 0 0 0 1.5px var(--muted)} }

/* Scelta (radiogroup) */
.scelta{display:flex; flex-wrap:wrap; gap:var(--s-2)}
.scelta button{appearance:none; border:0; cursor:pointer; min-height:44px; padding:0 var(--s-4); border-radius:var(--r-pill); background:var(--surface-2); color:var(--text); font-size:14px; font-weight:700; white-space:nowrap}
.scelta button[aria-checked="true"], .scelta a[aria-current="true"]{background:var(--text); color:var(--ink)}
.scelta a{display:inline-flex; align-items:center; min-height:44px; padding:0 var(--s-4); border-radius:var(--r-pill); background:var(--surface-2); font-size:14px; font-weight:700; text-decoration:none; white-space:nowrap}
.riquadro{background:var(--surface); border-radius:var(--r-m); padding:var(--s-4); display:flex; flex-direction:column; gap:var(--s-3)}
.riquadro h3,.riquadro-titolo{margin:0; font-size:17px; font-weight:700}

/* Campo */
.campo{display:flex; flex-direction:column; gap:6px}
.campo label{font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.campo input{height:52px; border-radius:var(--r-s); border:1.5px solid var(--line); background:var(--surface); color:var(--text); padding:0 14px; font-size:16px; width:100%}
.campo input:focus{outline:none; border-color:var(--magenta)}
.campo input[aria-invalid="true"]{border-color:var(--errore)}
.errore{margin:0; color:var(--errore); font-size:14px; font-weight:700}

/* Avviso, vuoto, nota */
.avviso{position:fixed; left:50%; bottom:calc(var(--nav-h) + 12px); transform:translateX(-50%); z-index:30; width:min(520px, calc(100% - 32px)); padding:var(--s-3) var(--s-4); border-radius:var(--r-m); background:#123D27; color:#B6F5D1; font-size:14px; font-weight:700; box-shadow:0 10px 30px rgba(0,0,0,.5); animation:avviso .3s var(--curva) both}
.pagina.senza-barra ~ .avviso{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@keyframes avviso{from{opacity:0; transform:translate(-50%, 12px)}}
.vuoto{margin:0; padding:var(--s-4); border:1.5px dashed var(--line); border-radius:var(--r-m); color:var(--muted); font-size:15px}
.nota-esempio{margin:var(--s-2) 0 0; font-size:13px; color:var(--dim); text-align:center}
.testo{margin:0; font-size:15px; color:#DCD7E4}
.testo-piccolo{margin:0; font-size:13px; color:var(--dim)}

/* Voci della richiesta */
.voci{margin:0; display:grid; gap:var(--s-3)}
.voci dt{font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--dim)}
.voci dd{margin:2px 0 0; font-size:17px; font-weight:700}
.telefono{color:var(--link); font-size:17px; font-weight:700; text-underline-offset:4px; align-self:flex-start; min-height:44px; display:inline-flex; align-items:center}
.citazione{margin:0; padding:var(--s-4); border-radius:var(--r-m); background:var(--surface); font-style:italic; color:#DCD7E4}

/* Barra in basso */
.barra{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--nav); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.barra ul{list-style:none; margin:0 auto; padding:0; max-width:560px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr))}
.barra a{display:flex; align-items:center; justify-content:center; min-height:56px; font-size:13px; font-weight:700; color:var(--muted); text-decoration:none; position:relative}
.barra a[aria-current="page"]{color:var(--text)}
.barra a[aria-current="page"]::before{content:""; position:absolute; top:0; left:24%; right:24%; height:3px; border-radius:0 0 3px 3px; background:var(--magenta)}

.barra a{white-space:nowrap}
.badge{position:absolute; top:6px; left:calc(50% + 20px); display:grid; place-items:center; min-width:18px; height:18px; padding:0 5px; border-radius:9px; font-size:11px !important; line-height:1; background:var(--magenta); color:var(--ink); font-size:12px; font-weight:900}
.numero-link{text-decoration:none; color:var(--text); box-shadow:inset 0 0 0 1.5px var(--magenta)}
.avviso-extra{margin:0; padding:var(--s-3) var(--s-4); border-radius:var(--r-m); background:var(--surface-2); color:var(--muted); font-size:14px}
input[type="search"]::-webkit-search-cancel-button{filter:invert(1)}
/* Lettore */
.lettore{background:#000; border:1px solid var(--line); border-radius:var(--r-l); min-height:300px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--s-4); padding:var(--s-5)}
.lettore.pieno{position:fixed; inset:0; border:0; border-radius:0; z-index:25}
.mira{width:200px; height:200px; border-radius:22px; box-shadow:0 0 0 3px #8E8A96; display:grid; place-items:center; overflow:hidden}
.mira svg{width:150px; height:150px; background:#fff; padding:8px; border-radius:6px; opacity:0; transform:scale(.7) rotate(-8deg); transition:opacity .25s, transform .35s var(--curva)}
.mira.letto{box-shadow:0 0 0 3px var(--ok)} .mira.letto svg{opacity:1; transform:none}
.inquadra{margin:0; font-size:20px; font-weight:700}
.simula{display:grid; gap:var(--s-2); width:100%; max-width:320px}
.simula .testo-piccolo{text-align:center}
.conteggio{display:flex; align-items:baseline; gap:var(--s-2)}
.conteggio b{font-size:44px; font-weight:900; font-stretch:112%; line-height:1}
.conteggio span{color:var(--muted); font-size:15px; font-weight:700}
.ingresso{display:flex; justify-content:space-between; align-items:center; gap:var(--s-3); padding:var(--s-3) var(--s-4); border-radius:var(--r-m); background:var(--surface); font-size:16px}
.ingresso em{font-style:normal; color:var(--muted)}
.ingresso time{color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums}

/* Esito */
.esito{position:fixed; inset:0; z-index:40; border:0; margin:0; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--s-2); text-align:center; color:#fff; cursor:pointer; padding:var(--s-6) var(--s-5) calc(var(--s-8) + env(safe-area-inset-bottom,0px))}
.esito.ok{background:var(--esito-ok)} .esito.no{background:var(--esito-no)} .esito.gia{background:var(--esito-gia)}
.esito strong{font-size:clamp(64px, 22vw, 120px); font-weight:900; font-stretch:112%; line-height:.9}
.esito b{font-size:26px; font-weight:700}
.esito span{font-size:19px; font-weight:700}
.esito small{font-size:15px; font-weight:700; opacity:.85}
.esito em{position:absolute; left:0; right:0; bottom:calc(var(--s-6) + env(safe-area-inset-bottom,0px)); font-style:normal; font-size:15px; opacity:.85}
@media (prefers-reduced-motion: no-preference){ .esito{animation:esito .2s ease-out both} }
@keyframes esito{from{opacity:0}}

/* PR e compleanni */
.pr-testa{display:flex; justify-content:space-between; align-items:baseline; gap:var(--s-3)}
.pr-testa b{font-size:16px; letter-spacing:.04em}
.pr-testa span{font-size:14px; color:var(--muted); white-space:nowrap}
.link-pr{display:flex; align-items:center; gap:var(--s-2); min-width:0}
.link-pr code{flex:1; min-width:0; display:flex; font-family:ui-monospace, "SF Mono", Menlo, monospace; font-size:13px; color:#DCD7E4}
.link-pr code span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.link-pr .btn{width:auto; min-height:44px; padding:0 var(--s-4); font-size:14px}

/* Biglietto */
.scheda-biglietto{background:var(--surface); border-radius:var(--r-l); padding:var(--s-5); display:grid; gap:var(--s-4)}
.scheda-biglietto dt{font-size:12px; font-weight:800; letter-spacing:.06em; color:var(--dim); text-transform:uppercase}
.scheda-biglietto dd{margin:2px 0 0; font-size:18px; font-weight:700}
.btn-wallet{background:#000; color:#fff; box-shadow:inset 0 0 0 1.5px var(--text); width:auto; align-self:flex-start; padding:0 var(--s-5)}

/* Finestra di conferma */
dialog.conferma{border:0; padding:0; background:transparent; color:var(--text); width:100%; max-width:none; margin:auto 0 0}
dialog.conferma::backdrop{background:rgba(0,0,0,.7)}
.conferma-in{background:var(--surface); border-radius:var(--r-l) var(--r-l) 0 0; padding:var(--s-5) 20px calc(var(--s-5) + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:var(--s-3); max-width:560px; margin:0 auto}
.conferma-in h2{margin:0; font-size:22px; font-weight:900; font-stretch:112%}

/* Strumento di anteprima (non fa parte del pannello) */
.anteprima-btn{position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); right:10px; z-index:50; appearance:none; border:0; border-radius:var(--r-pill); background:var(--acid); color:var(--ink); font-size:13px; font-weight:800; min-height:36px; padding:0 14px; cursor:pointer}
.anteprima{position:fixed; top:0; right:0; bottom:0; z-index:60; width:min(360px, 100%); background:#0B0A0F; border-left:1px solid var(--line); padding:var(--s-5) var(--s-4); overflow-y:auto; display:flex; flex-direction:column; gap:var(--s-3)}
.anteprima h2{margin:0; font-size:17px}
.anteprima ol{margin:0; padding:0; list-style:none; display:grid; gap:4px}
.anteprima a{display:flex; gap:10px; padding:10px 12px; border-radius:var(--r-s); background:var(--surface); text-decoration:none; font-size:14px}
.anteprima a b{color:var(--acid); font-variant-numeric:tabular-nums; min-width:28px}

.anteprima-btn{top:auto; bottom:calc(var(--nav-h) + 12px); right:12px}
.pagina.senza-barra ~ .anteprima-btn{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.numero b{white-space:nowrap; font-size:clamp(22px, 6.8vw, 30px)}
.esito.gia strong{font-size:clamp(48px, 15vw, 96px)}
.titolo{max-width:100%} .esito strong,.esito b{display:block; width:100%}
@media (max-width:359px){ .numero{padding:var(--s-2) 10px} .numero span{font-size:12px} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition:none !important} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="chev" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
</svg>

<main id="app" class="pagina" tabindex="-1"></main>
<nav class="barra" id="barra" aria-label="Schermate del pannello"></nav>
<button type="button" class="esito" id="esito" hidden></button>
<div id="avvisi" aria-live="polite"></div>
<dialog class="conferma" id="dlg" aria-labelledby="dlgT"><div class="conferma-in"><h2 id="dlgT"></h2><p class="testo" id="dlgP"></p><button type="button" class="btn btn-pieno" id="dlgOk"></button><button type="button" class="btn btn-vuoto" id="dlgNo">Annulla</button></div></dialog>

<button type="button" class="anteprima-btn" id="antBtn" aria-expanded="false" aria-controls="ant" data-audit-ignora>Stati</button>
<aside class="anteprima" id="ant" hidden aria-label="Tutti gli stati del prototipo" data-audit-ignora>
  <h2>Tutti gli stati</h2>
  <p class="testo-piccolo">Strumento del prototipo, non fa parte del pannello. I numeri sono quelli degli screenshot del pannello vecchio.</p>
  <ol id="antLista"></ol>
  <button type="button" class="btn btn-vuoto" id="antReset">Ricomincia da capo</button>
</aside>

<script>
/**
 * a-capo.js — tipografia nel browser, per siti statici o come rete di sicurezza.
 *
 * Uso:
 *   Includi il file con un tag script (src="/a-capo.js", defer), poi:
 *   addEventListener('DOMContentLoaded', () => ACapo.avvia());
 *
 * Opzioni di ACapo.avvia({...}):
 *   radice      elemento da trattare (default: document.body)
 *   adatta      selettore dei titoli da rimpicciolire finché la parola più lunga ci sta
 *               (default: '.display, .card h2, .card h3, [data-adatta]')
 *   minimo      quanto può scendere un titolo, in rapporto alla misura del CSS (default 0.45)
 *   osserva     rilegge i testi che cambiano dopo il caricamento (default true)
 *
 * Funzioni singole: ACapo.lega(radice), ACapo.adattaTitoli(radice), ACapo.sciogliSeSfora(radice).
 * Con i router a pagina singola chiama ACapo.aggiorna(paginaVisibile) a ogni cambio pagina.
 */
(function () {
  const NB = '\u00A0';
  const BREVI = ['il','lo','la','i','gli','le','un','uno','una','di','a','da','in','con','su','per','tra','fra',
    'del','dello','della','dei','degli','delle','al','allo','alla','ai','agli','alle','dal','dallo','dalla','dai','dagli','dalle',
    'nel','nello','nella','nei','negli','nelle','sul','sullo','sulla','sui','sugli','sulle','col',
    'e','ed','o','od','ma','né','che','se','perché','quando','come','dove','mentre','anche',
    'mi','ti','ci','vi','si','ne','li','non','ogni','più','meno','senza','sotto','sopra','dopo','prima','tu','io',
    // inglese
    'an','the','of','to','on','at','by','for','with','from','and','or','but','if','as','is','it','my','your','our','no','not'];
  const reBrevi = new RegExp('(?<=^|[\\s(«"“\'’\\[])(' + BREVI.join('|') + ')[ \\t\\n]+(?=\\S)', 'giu');
  const reUnita = /(\d)[ \t]+(?=(€|%|euro|ore|minuti|secondi|sere|giorni|notti|anni|mesi|km|kg|persone|posti|gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)(?![\p{L}]))/giu;
  const rePrima = /(?<=^|\s)(Room|Pack|Sala|Giorno|ore|alle|dalle|n\.|art\.)[ \t]+(?=\d)/giu;

  function lega(radice) {
    radice = radice || document.body;

  function sciogliSeSfora(radice) {

    ['07b', 'Richiesta, preparo il biglietto', () => { reset(); S.preparo['giulia-marchetti'] = true; return '#/pannello/richieste/giulia-marchetti'; }],
    ['08', 'Richiesta dopo Conferma e scrivi', () => { reset(); const r = richiesta('giulia-marchetti'); r.stato = 'confermata'; r.bigliettoInviatoAlle = ora(); S.pronto['giulia-marchetti'] = true; return '#/pannello/richieste/giulia-marchetti'; }],
    ['09', 'Richiesta già confermata', () => { reset(); return '#/pannello/richieste/federico-nardi'; }],
    ['10', 'Serate', () => { reset(); return '#/pannello/serate'; }],
    ['11', 'Serate, aggiungi un ospite', () => { reset(); S.ospite = true; return '#/pannello/serate'; }],
    ['12', 'Squadra', () => { reset(); return '#/pannello/squadra'; }],
    ['13', 'Squadra, link copiato', () => { reset(); S.copiato = 'lucacalifornia.satoshiweb.it/marco'; return '#/pannello/squadra'; }],
    ['14', 'Extra: porta, lettore spento', () => { reset(); return '#/pannello/porta'; }],
    ['21', 'Extra: porta, lettore acceso', () => { reset(); S.porta = 'cerco'; return '#/pannello/porta'; }],
    ['19', 'Extra: esito valido', () => { reset(); S.porta = 'cerco'; S.esito = { tipo: 'ok', nome: 'Giulia Marchetti', tipo2: 'TAVOLO, MISTO', sala: 'Sala 2', serata: 'SABATO' }; return '#/pannello/porta'; }],
    ['20', 'Extra: esito non valido', () => { reset(); S.porta = 'cerco'; S.esito = { tipo: 'no' }; return '#/pannello/porta'; }],
    ['23', 'Extra: esito già dentro', () => { reset(); S.porta = 'cerco'; S.esito = { tipo: 'gia', nome: 'Giulia Marchetti', ora: '00:39' }; return '#/pannello/porta'; }],
    ['24', 'Extra: fotocamera non disponibile', () => { reset(); S.porta = 'errore'; return '#/pannello/porta'; }],
    ['17', 'Extra: staff scan, spento', () => { reset(); return '#/staff/scan'; }],
    ['18', 'Extra: staff scan, inquadra', () => { reset(); S.porta = 'cerco'; return '#/staff/scan'; }],
    ['16', 'Biglietto prova', () => { reset(); return '#/biglietto/prova'; }]
  ];
  const ant = $('#ant'), antBtn = $('#antBtn');
  $('#antLista').innerHTML = STATI.map(([n, t], i) => `<li><a href="#" data-stato="${i}"><b>${n}</b>${t}</a></li>`).join('');
  antBtn.addEventListener('click', () => { const aperto = ant.hidden; ant.hidden = !aperto; antBtn.setAttribute('aria-expanded', String(aperto)); antBtn.textContent = aperto ? 'Chiudi' : 'Stati'; });
  ant.addEventListener('click', (e) => {
    const a = e.target.closest('[data-stato]'); if (!a) return; e.preventDefault();
    const h = STATI[+a.dataset.stato][2](); $('#avvisi').innerHTML = ''; ant.hidden = true; antBtn.textContent = 'Stati'; antBtn.setAttribute('aria-expanded', 'false');
    if (location.hash === h) mostra(); else location.hash = h;
  });
  $('#antReset').addEventListener('click', () => { reset(); ant.hidden = true; antBtn.textContent = 'Stati'; location.hash = '#/pannello/richieste'; mostra(); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && !ant.hidden) antBtn.click(); });

  if (window.ACapo) ACapo.avvia({ adatta: '[data-adatta-acapo]' }); if (document.fonts) document.fonts.ready.then(() => setTimeout(adattaTutto, 0));
  mostra();
})();
</script>
